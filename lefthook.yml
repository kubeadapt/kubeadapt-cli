commit-msg:
  commands:
    commitizen:
      run: cz check --commit-msg-file {1}

pre-commit:
  parallel: true
  commands:
    trufflehog:
      glob: "*"
      run: NO_COLOR=1 TERM=dumb trufflehog git file://. --since-commit HEAD --only-verified --fail --no-update --no-color
      stage_fixed: false

    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    goimports:
      glob: "*.go"
      run: goimports -w {staged_files}
      stage_fixed: true

    # Scans the whole project but reports only issues new since HEAD~.
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD~
      stage_fixed: false

pre-push:
  commands:
    test:
      run: go test -race -cover ./...
