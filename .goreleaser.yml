version: 2

project_name: kubeadapt

before:
  hooks:
    - go mod tidy

builds:
  - id: default
    main: ./cmd/kubeadapt
    binary: kubeadapt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/kubeadapt/kubeadapt-cli/internal/version.Version={{.Version}}
      - -X github.com/kubeadapt/kubeadapt-cli/internal/version.Commit={{.Commit}}
      - -X github.com/kubeadapt/kubeadapt-cli/internal/version.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto

brews:
  - name: kubeadapt
    repository:
      owner: kubeadapt
      name: homebrew-tap
    commit_author:
      name: kubeadapt-platform-assistant[bot]
      email: kubeadapt-platform-assistant[bot]@users.noreply.github.com
    commit_msg_template: "chore(deps): update formula for {{ .ProjectName }} {{ .Tag }}"
    homepage: "https://kubeadapt.io"
    description: "Kubeadapt CLI for Kubernetes cost optimization"
    license: "Apache-2.0"
    install: |
      bin.install "kubeadapt"
    test: |
      system "#{bin}/kubeadapt", "version"
