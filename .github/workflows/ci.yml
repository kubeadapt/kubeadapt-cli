name: Test Suite

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  test-suite:
    uses: kubeadapt/public-actions/.github/workflows/golang-cli-test-suite.yml@e8da44faff2a77340057bbc432f5e27c3babebe0 # main
    with:
      go_version: '1.26.x'
