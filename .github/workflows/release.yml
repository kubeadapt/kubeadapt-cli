name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: kubeadapt/public-actions/.github/workflows/golang-cli-release.yml@e8da44faff2a77340057bbc432f5e27c3babebe0 # main
    with:
      go_version: '1.26.x'
    secrets:
      PLATFORM_ASSISTANT_GH_APP_ID: ${{ secrets.PLATFORM_ASSISTANT_GH_APP_ID }}
      PLATFORM_ASSISTANT_GH_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_ASSISTANT_GH_APP_PRIVATE_KEY }}
